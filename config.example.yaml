server:
  addr: ":8080"
  client_tokens:
    - "sk-todo2api-changeme"

storage:
  # Relative paths resolve from this configuration file.
  path: "data/todo2api.db"
  # Generate once with: openssl rand -base64 32
  # Keep this value unchanged after the database has been created.
  master_key: "REPLACE_WITH_BASE64_ENCODED_32_BYTE_KEY"

web:
  admin_username: "admin"
  admin_password: "change-me"
  session_ttl: 12h
  secure_cookie: false # Set true when serving over HTTPS.
  # Forwarded headers are accepted only from these proxy source networks.
  # The proxy must overwrite X-Forwarded-For/Host/Proto from clients.
  trusted_proxies: [] # Example: ["127.0.0.1/32", "::1/128"]

upstream:
  base_url: "https://api.todofor.ai/api/v1"
  poll_timeout: 5m

pool:
  strategy: "round_robin" # round_robin or least_busy
  # Legacy one-time import sources. After the first successful database start,
  # these values are retained only for rollback and are never read again.
  key_files: []
  keys:
    - api_key: "${TODOFOR_API_KEY}"
      project_id: "" # Empty selects the account's first project.
      agent_id: "" # Empty selects the account's first AgentSettings template.

models:
  # todofor.ai's runner requires provider:author/model_id.
  # The catalog is exposed automatically with short names. Aliases are only
  # needed for custom names or overrides; full IDs remain accepted by clients.
  default: "openai:openai/gpt-5.6-sol"
  aliases:
    gpt-5.6-sol: "openai:openai/gpt-5.6-sol"

# Edge MCP tools are optional. When enabled, allowed tools are discovered once
# and forwarded as filteredEdgeTools on each upstream request.
edge:
  enabled: false
  edge_id: "" # Empty selects the first online Edge.
  allow_tools: [] # Empty allows all discovered Edge MCP tools.

# Applied only when an OpenAI request includes client-side tools. The official
# permission matcher treats device:* as every concrete Edge/bridge device.
tool_protocol:
  deny_upstream_tools:
    - "device:*"
    - "cloud:*"
